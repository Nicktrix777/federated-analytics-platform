# Alembic config for the postgres-meta schema.
#
# This is the SINGLE source of truth for the metadata DB schema — it replaces
# the old init/postgres-meta-init.sql + scripts/migrate.sh + scripts/migrations/*.sql.
# The DB URL is built from POSTGRES_META_* env vars in alembic/env.py, so there
# is no connection string committed here.
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
