version: '3.9'

networks:
  federation-net:
    driver: bridge

volumes:
  postgres-meta-data:
  postgres-source-data:
  mongo-source-data:
  elasticsearch-data:

services:

  # ──────────────────────────────────────────────
  # METADATA DATABASE (PostgreSQL)
  # Stores: dataset registry, data_sources, dashboards, audit logs
  # ──────────────────────────────────────────────
  postgres-meta:
    # pgvector image (superset of postgres:16) — needed for schema-RAG
    # embeddings (dataset_embeddings.embedding vector column). The schema is
    # created and versioned by the db-migrate service (Alembic), NOT by a
    # docker-entrypoint init script, so this starts as an empty database.
    image: pgvector/pgvector:pg16
    container_name: fap-postgres-meta
    environment:
      POSTGRES_DB: analytics_meta
      POSTGRES_USER: meta_user
      POSTGRES_PASSWORD: meta_pass_2024
    ports:
      - "5434:5432"
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    networks:
      - federation-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meta_user -d analytics_meta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # DB MIGRATE (one-shot) — applies the postgres-meta schema via Alembic.
  # Single source of truth for the schema (replaced the init SQL + migrate.sh
  # + numbered migrations). Runs `alembic upgrade head` and exits; core-api and
  # ai-engine wait for it to complete before starting.
  # ──────────────────────────────────────────────
  db-migrate:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: fap-db-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_META_HOST: postgres-meta
      POSTGRES_META_PORT: 5432
      POSTGRES_META_DB: analytics_meta
      POSTGRES_META_USER: meta_user
      POSTGRES_META_PASSWORD: meta_pass_2024
    networks:
      - federation-net
    restart: "no"
    depends_on:
      postgres-meta:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # SOURCE DATABASE — PostgreSQL
  # ──────────────────────────────────────────────
  postgres-source:
    image: postgres:16-alpine
    container_name: fap-postgres-source
    environment:
      POSTGRES_DB: ${POSTGRES_SOURCE_DB:-source_db}
      POSTGRES_USER: ${POSTGRES_SOURCE_USER:-source_user}
      POSTGRES_PASSWORD: ${POSTGRES_SOURCE_PASSWORD:-source_pass_2024}
    ports:
      - "5433:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
    networks:
      - federation-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SOURCE_USER:-source_user} -d ${POSTGRES_SOURCE_DB:-source_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # SOURCE DATABASE — MongoDB
  # ──────────────────────────────────────────────
  mongo-source:
    image: mongo:7
    container_name: fap-mongo-source
    ports:
      - "27017:27017"
    volumes:
      - mongo-source-data:/data/db
    networks:
      - federation-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # ELASTICSEARCH
  # New data source — federated via Trino ES connector
  # Access: http://localhost:9200
  # ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fap-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=fap-cluster
      - node.name=fap-node-1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - federation-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────
  # TRINO — Federated Query Engine
  # Federates across Postgres, MongoDB, and Elasticsearch
  # ──────────────────────────────────────────────
  trino:
    image: trinodb/trino:438
    container_name: fap-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config/config.properties:/etc/trino/config.properties:ro
      - ./trino/config/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/config/node.properties:/etc/trino/node.properties:ro
    networks:
      - federation-net
    depends_on:
      postgres-source:
        condition: service_healthy
      mongo-source:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────
  # AI ENGINE SERVICE (Python / FastAPI + deepagents)
  # Multi-agent: schema-analyst, sql-generator (+ deterministic SQL validation)
  # ──────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: fap-ai-engine
    environment:
      # Provider-agnostic LLM config. Every *_MODEL is a provider-prefixed
      # string ("openai:gpt-4o", "anthropic:claude-sonnet-5", "google_genai:..");
      # the prefix decides the endpoint + key. Default: Google Gemini free tier
      # (set GOOGLE_API_KEY). Switch providers by editing the strings + the key —
      # no code changes; also editable live from the UI Settings page.
      # These defaults are overlaid by the DB-stored config at startup, so a
      # value saved in the UI survives restarts.
      LLM_MODEL: ${LLM_MODEL:-google_genai:gemini-flash-latest}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCHEMA_ANALYST_MODEL: ${SCHEMA_ANALYST_MODEL:-google_genai:gemini-flash-lite-latest}
      SQL_GENERATOR_MODEL: ${SQL_GENERATOR_MODEL:-google_genai:gemini-flash-latest}
      # Custom single-shot path (fast plan, dashboard/report SQL, repair, embeddings).
      FAST_PATH_MODEL: ${FAST_PATH_MODEL:-google_genai:gemini-flash-lite-latest}
      DASHBOARD_WIDGET_SQL_MODEL: ${DASHBOARD_WIDGET_SQL_MODEL:-google_genai:gemini-flash-latest}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-google_genai:gemini-embedding-001}
      # Base URL + key for the openai_compat:/ollama: prefixes only (self-hosted).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Fast path + rate limits (documented in .env.example) — must be forwarded
      # here or the container falls back to code defaults.
      FAST_PATH_ENABLED: ${FAST_PATH_ENABLED:-true}
      FAST_PATH_CONFIDENCE_THRESHOLD: ${FAST_PATH_CONFIDENCE_THRESHOLD:-0.55}
      LLM_FRONTIER_RPM: ${LLM_FRONTIER_RPM:-0}
      LLM_FAST_RPM: ${LLM_FAST_RPM:-0}
      LLM_EMBED_RPM: ${LLM_EMBED_RPM:-0}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      AI_MAX_CONCURRENT_PLANS: ${AI_MAX_CONCURRENT_PLANS:-4}
      AI_QUEUE_TIMEOUT_SECONDS: ${AI_QUEUE_TIMEOUT_SECONDS:-45}
      SCHEMA_TOOL_CACHE_TTL_SECONDS: ${SCHEMA_TOOL_CACHE_TTL_SECONDS:-60}
      POSTGRES_META_HOST: postgres-meta
      POSTGRES_META_PORT: 5432
      POSTGRES_META_DB: analytics_meta
      POSTGRES_META_USER: meta_user
      POSTGRES_META_PASSWORD: meta_pass_2024
      TRINO_HOST: trino
      TRINO_PORT: 8080
    ports:
      - "8082:8082"
    networks:
      - federation-net
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-meta:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────
  # QUERY SERVICE (Go)
  # ──────────────────────────────────────────────
  query-service:
    build:
      context: ./query-service
      dockerfile: Dockerfile
    container_name: fap-query-service
    environment:
      TRINO_HOST: trino
      TRINO_PORT: 8080
      QUERY_SERVICE_PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - federation-net
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # CORE API SERVICE (Go / Gin)
  # Now includes: data source management + dashboard builder APIs
  # ──────────────────────────────────────────────
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: fap-core-api
    environment:
      CORE_API_PORT: 8081
      AI_ENGINE_URL: http://ai-engine:8082
      QUERY_SERVICE_URL: http://query-service:8083
      AI_ENABLED: ${AI_ENABLED:-true}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-poc-demo-token-2024}
      POSTGRES_META_HOST: postgres-meta
      POSTGRES_META_PORT: 5432
      POSTGRES_META_DB: analytics_meta
      POSTGRES_META_USER: meta_user
      POSTGRES_META_PASSWORD: meta_pass_2024
      POSTGRES_SOURCE_HOST: postgres-source
      POSTGRES_SOURCE_PORT: 5432
      POSTGRES_SOURCE_DB: ${POSTGRES_SOURCE_DB:-source_db}
      POSTGRES_SOURCE_USER: ${POSTGRES_SOURCE_USER:-source_user}
      POSTGRES_SOURCE_PASSWORD: ${POSTGRES_SOURCE_PASSWORD:-source_pass_2024}
      TRINO_HOST: trino
      TRINO_PORT: 8080
    ports:
      - "8081:8081"
    networks:
      - federation-net
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-meta:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
      query-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # FRONTEND (React + TypeScript + Vite / Nginx)
  # Now includes: Dashboard Builder + Data Sources UI
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_TOKEN: ${VITE_API_TOKEN:-poc-demo-token-2024}
    container_name: fap-frontend
    ports:
      - "3000:80"
    networks:
      - federation-net
    depends_on:
      core-api:
        condition: service_healthy
