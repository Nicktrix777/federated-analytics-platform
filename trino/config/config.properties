# ── Trino Coordinator Configuration ─────────────────────────
coordinator=true
node-scheduler.include-coordinator=true

# HTTP server
http-server.http.port=8080

# Query limits
query.max-memory=512MB
query.max-memory-per-node=256MB
# Hard wall-clock cap so a bad AI-generated query (e.g. an accidental full
# cross-join) can't run indefinitely against a live customer database.
query.max-execution-time=5m

# Discovery
discovery.uri=http://localhost:8080
