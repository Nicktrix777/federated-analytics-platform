# ── Trino Catalog: Tally ──────────────────────────────────────────
# One static catalog shared by every registered customer's Tally company -
# same shared-catalog/per-schema design as zoho_books.properties. Every
# registered connection goes through core-api's tally-bridge tunnel (see
# trino-plugins/tally/TallyTransport.java) since the platform cannot
# assume network access to a customer's Tally instance.
connector.name=tally
metadata.jdbc-url=jdbc:postgresql://postgres-meta:5432/analytics_meta
metadata.jdbc-user=meta_user
metadata.jdbc-password=${ENV:POSTGRES_META_PASSWORD}
datasource-encryption-key=${ENV:DATASOURCE_ENCRYPTION_KEY}
core-api.base-url=http://core-api:8081
internal-service-token=${ENV:INTERNAL_SERVICE_TOKEN}

# Dynamic schema discovery (see TallySchemaSampler/TallyColumnResolver) - live
# samples a real Tally response to discover columns beyond TallyEntity's
# fixed baseline, caching the result (names + types ONLY, never a real
# customer value) for this long before re-sampling. Both optional - these are
# the defaults if omitted.
schema-discovery.ttl-seconds=3600
schema-discovery.sample-timeout-seconds=10
