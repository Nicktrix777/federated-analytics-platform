# ── Trino Catalog: Zoho Books ──────────────────────────────────────
# One static catalog shared by every registered customer's Zoho org - the
# connector plugin resolves each org as its own schema by reading
# data_sources directly from postgres-meta at query time (see
# trino-plugins/zoho-books/). Registering a new customer connection never
# needs a new catalog file or a Trino restart.
connector.name=zoho_books
metadata.jdbc-url=jdbc:postgresql://postgres-meta:5432/analytics_meta
metadata.jdbc-user=meta_user
metadata.jdbc-password=${ENV:POSTGRES_META_PASSWORD}
datasource-encryption-key=${ENV:DATASOURCE_ENCRYPTION_KEY}

# Dynamic schema discovery (see ZohoSchemaSampler/ZohoColumnResolver) - live
# samples real Zoho Books records to discover columns beyond ZohoEntity's
# fixed baseline, caching the result (names + types ONLY, never a real
# customer value) for this long before re-sampling. Optional - this is the
# default if omitted.
schema-discovery.ttl-seconds=3600
