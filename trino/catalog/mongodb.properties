# ── Trino Catalog: MongoDB Source ─────────────────────────────
# This connector federates queries to the user-managed MongoDB instance.
#
# NOTE on schema inference:
#   Trino samples documents in each collection to infer column types.
#   For best results, ensure documents within a collection have consistent
#   field types. Mixed types (e.g., a field that is sometimes string,
#   sometimes int) will be treated as VARCHAR.
#
#   If your collections have highly irregular schemas, consider one of:
#   1. Using MongoDB's $project aggregation in a view for a stable schema
#   2. Adding a 'schema' metadata file at _schema collection in MongoDB
#   3. Projecting specific fields in your Trino SQL queries
#
connector.name=mongodb
mongodb.connection-url=mongodb://mongo-source:27017
mongodb.schema-collection=_schema
mongodb.case-insensitive-name-matching=false

# Number of documents to sample for schema inference (default 1000)
# Increase if your collections have many optional fields
mongodb.cursor-batch-size=100
