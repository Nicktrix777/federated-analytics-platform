name: AI Accuracy Eval

# Not a per-PR gate: qa/ai-eval/run_eval.py has no built-in pass/fail threshold,
# so it can't block an individual PR's merge the way pr-checks.yml does. This
# runs nightly plus whenever ai-engine/core-api change on main, and surfaces
# the scorecard in the job summary + as an artifact so a regression is visible
# without anyone needing to dig through logs.
on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'ai-engine/**'
      - 'core-api/**'
  workflow_dispatch: {}

concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cp .env.example .env
          sed -i "s|^ALLOW_DEV_DEFAULTS=.*|ALLOW_DEV_DEFAULTS=true|" .env
          sed -i "s|^DATASOURCE_ENCRYPTION_KEY=.*|DATASOURCE_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^GOOGLE_API_KEY=.*|GOOGLE_API_KEY=${GOOGLE_API_KEY}|" .env
          sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=${OPENAI_API_KEY}|" .env

      - name: Bring up the stack
        run: docker compose up -d --build --wait

      - name: Seed source databases
        run: make seed-all

      - name: Sync catalogs
        run: |
          curl -sf -X POST http://localhost:8081/api/datasources/sync \
            -H "Authorization: Bearer poc-demo-token-2024"

      - name: Run AI eval
        run: |
          if [ -n "${OPENAI_API_KEY}" ]; then
            python3 qa/ai-eval/run_eval.py --judge
          else
            echo "No OPENAI_API_KEY secret set — running deterministic checks only."
            python3 qa/ai-eval/run_eval.py
          fi

      - name: Write job summary
        if: always()
        run: |
          if [ -f qa/ai-eval/results/scorecard.md ]; then
            cat qa/ai-eval/results/scorecard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-results
          path: qa/ai-eval/results/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
