name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: lint-go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-api, query-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - working-directory: ${{ matrix.service }}
        run: |
          go vet ./...
          go build ./...
          go test ./...

  test-ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements*.txt
      - working-directory: ai-engine
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  env-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-env-sync.py

  e2e-ux:
    # PR-only: the whole point is verifying a change before it merges. Once it's
    # on main it's already been through this, so re-running it (and re-spending
    # a real Gemini quota call) on every push to main is pure waste.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # CI-only .env: same defaults as .env.example, with ALLOW_DEV_DEFAULTS
      # set (this is an ephemeral runner, not a real deployment), a freshly
      # generated encryption key, and the real LLM key from repo secrets so
      # AI-dependent specs (03-query-ai) get an actual answer, not a stub.
      - name: Generate CI .env
        run: |
          cp .env.example .env
          sed -i "s|^ALLOW_DEV_DEFAULTS=.*|ALLOW_DEV_DEFAULTS=true|" .env
          sed -i "s|^DATASOURCE_ENCRYPTION_KEY=.*|DATASOURCE_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^GOOGLE_API_KEY=.*|GOOGLE_API_KEY=${GOOGLE_API_KEY}|" .env

      - name: Bring up the stack
        run: docker compose up -d --build --wait

      - name: Seed source databases
        run: make seed-all

      - name: Sync catalogs
        run: |
          curl -sf -X POST http://localhost:8081/api/datasources/sync \
            -H "Authorization: Bearer poc-demo-token-2024"

      - name: Run UX suite
        run: ./qa/run.sh

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: qa/artifacts/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
