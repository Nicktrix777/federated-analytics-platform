# Dev-mode overlay — live reload on source changes.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Leaves docker-compose.yml untouched so the plain `docker compose up` path
# (e.g. for a demo) keeps building the production images exactly as before.
#
# - core-api / query-service (Go): air watches *.go and rebuilds+restarts
#   the binary in-container.
# - ai-engine (Python): uvicorn --reload watches *.py.
# - frontend: Vite dev server with HMR instead of the Nginx static build.

volumes:
  core-api-gomod-cache:
  query-service-gomod-cache:

services:
  # One-shot schema migrator — reuse the ai-engine dev image (which has alembic
  # installed) and bind-mount the source so migration files are live.
  db-migrate:
    image: fap-ai-engine:dev
    volumes: !override
      - ./ai-engine:/app

  # Each dev service below gets its own `image:` tag distinct from the prod
  # compose file's default (<project>-<service>). Without this, `docker
  # compose build`/`up --build` here overwrites the SAME image tag the plain
  # `docker compose up` (docker-compose.yml only) expects — and since Compose
  # only rebuilds an image if it's missing, a later plain `up` silently reuses
  # the dev image (air/vite CMD, no source baked in, no bind mount) and
  # crash-loops. Ask us how we know.
  core-api:
    image: fap-core-api:dev
    build: !override
      context: ./core-api
      dockerfile: Dockerfile.dev
    volumes: !override
      - ./core-api:/app
      - core-api-gomod-cache:/go/pkg/mod
    ports: !override
      - "8081:8081"

  query-service:
    image: fap-query-service:dev
    build: !override
      context: ./query-service
      dockerfile: Dockerfile.dev
    volumes: !override
      - ./query-service:/app
      - query-service-gomod-cache:/go/pkg/mod
    ports: !override
      - "8083:8083"

  ai-engine:
    image: fap-ai-engine:dev
    volumes: !override
      - ./ai-engine:/app
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8082", "--reload"]
    ports: !override
      - "8082:8082"

  frontend:
    image: fap-frontend:dev
    build: !override
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://core-api:8081
      VITE_API_TOKEN: ${VITE_API_TOKEN:-poc-demo-token-2024}
    volumes: !override
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "3000:5173"

  # ── Tally test double (dev/test only — see mock-tally/server.py) ──
  # Neither of these exists in docker-compose.yml: TallyPrime is proprietary
  # Windows software with no official Docker image, so this is what
  # trino-plugins/tally is actually exercised against in this repo.
  mock-tally:
    build:
      context: ./mock-tally
    container_name: fap-mock-tally
    networks:
      - federation-net

  # Bootstrap (one-time, manual — the token can't be known ahead of time):
  #   1. docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mock-tally core-api
  #   2. curl -X POST http://localhost:8081/api/datasources \
  #        -H "Authorization: Bearer $API_AUTH_TOKEN" -H "Content-Type: application/json" \
  #        -d '{"name":"Dev Tally Co","source_type":"tally"}'
  #      -> copy the returned "bridge_token"
  #   3. TALLY_BRIDGE_TOKEN=<that token> docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d tally-bridge
  # Then query e.g. tally.dev_tally_co.ledgers from Trino.
  tally-bridge:
    build:
      context: ./tally-bridge
    container_name: fap-tally-bridge
    command:
      - "-server=http://core-api:8081"
      - "-token=${TALLY_BRIDGE_TOKEN:-}"
      - "-tally=http://mock-tally:9000"
    depends_on:
      - mock-tally
      - core-api
    networks:
      - federation-net
